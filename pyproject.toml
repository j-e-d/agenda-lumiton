[project]
name = "agenda-lumiton"
version = "0.1.0"
description = "Scraper para la agenda de proyecciones de Lumiton y generador de calendarios ICS"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4==4.12.3",
    "icalendar==5.0.13",
    "pytz==2024.1",
    "cloudscraper==1.2.71",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
    "ty>=0.0.101",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
# Scraper modules import each other as top-level modules (run as scripts)
known-first-party = ["calendar_generator", "event_keys", "imdb_dataset", "scraper", "venues", "conftest"]

[tool.ty.environment]
python-version = "3.11"
extra-paths = ["scraper", "tests"]
