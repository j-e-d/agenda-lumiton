name: Re-run failed scrape

# A failed scrape is often a block of that runner's IP by the site's
# Cloudflare. Re-running the failed job gets a new runner, usually with a
# different IP. Only first attempts are re-run, so this can't loop.
on:
  workflow_run:
    workflows: ["Daily Scraper"]
    types: [completed]

permissions: {}

jobs:
  rerun:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Re-run failed jobs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          # Give a short-lived block a moment to clear
          sleep 120
          gh run rerun "$RUN_ID" --failed
