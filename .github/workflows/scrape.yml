name: Daily Scraper

on:
  schedule:
    - cron: '42 23 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scraper/**'
      - '.github/workflows/scrape.yml'
      - 'pyproject.toml'

# One run at a time; a run triggered meanwhile waits instead of racing the push
concurrency:
  group: scrape
  cancel-in-progress: false

permissions: {}

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    permissions:
      contents: write
      issues: write
    env:
      # Every uv command (sync and each `uv run`) skips the dev tools and
      # fails rather than re-locks if uv.lock is out of date
      UV_NO_DEV: "1"
      UV_LOCKED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Install dependencies
        run: |
          uv sync

      # IMDb ratings/runtimes come from IMDb's non-commercial datasets,
      # rebuilt into a slim SQLite index every 30 days and cached between runs
      - name: Compute IMDb index cache key
        id: imdb-key
        run: echo "period=$(( $(date -u +%s) / (30 * 86400) ))" >> "$GITHUB_OUTPUT"

      # restore-keys falls back to last period's index, so a failed rebuild
      # still leaves a usable (slightly older) index in place
      - name: Restore IMDb index
        id: imdb-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/imdb.sqlite
          key: imdb-index-v1-${{ steps.imdb-key.outputs.period }}
          restore-keys: imdb-index-v1-

      - name: Build IMDb index
        id: imdb-build
        if: steps.imdb-cache.outputs.cache-hit != 'true'
        # A failed build only means no new ratings this run, not a failed scrape
        continue-on-error: true
        run: |
          uv run scraper/imdb_dataset.py build

      # Save right away, so a later failing step doesn't discard the build
      - name: Save IMDb index
        if: steps.imdb-build.outcome == 'success'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/imdb.sqlite
          key: imdb-index-v1-${{ steps.imdb-key.outputs.period }}

      # Track consecutive build failures: a cached marker holds the date of the
      # first failure in a streak. The key holds the run_id so each failing
      # run can save; a successful build writes a "cleared" marker, so a
      # streak can't outlive it, and it spans 30-day period boundaries.
      - name: Restore IMDb failure marker
        id: imdb-fail-restore
        if: steps.imdb-build.outcome == 'failure'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/imdb-first-failure
          key: imdb-fail-${{ github.run_id }}
          restore-keys: imdb-fail-

      - name: Record first IMDb failure
        id: imdb-fail-new
        if: steps.imdb-build.outcome == 'failure'
        run: |
          mkdir -p .cache
          # No marker, or the last one was cleared by a successful build:
          # this run starts a new streak
          if ! grep -qE '^[0-9]+$' .cache/imdb-first-failure 2>/dev/null; then
            date -u +%s > .cache/imdb-first-failure
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Clear IMDb failure marker
        id: imdb-fail-clear
        if: steps.imdb-build.outcome == 'success'
        run: |
          mkdir -p .cache
          echo cleared > .cache/imdb-first-failure

      - name: Save IMDb failure marker
        if: steps.imdb-fail-new.outputs.new == 'true' || steps.imdb-fail-clear.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/imdb-first-failure
          key: imdb-fail-${{ github.run_id }}

      - name: Open issue after 3 days of IMDb failures
        if: steps.imdb-build.outcome == 'failure'
        # Monitoring only: a failure here must not skip the scrape
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          first=$(cat .cache/imdb-first-failure)
          days=$(( ($(date -u +%s) - first) / 86400 ))
          echo "IMDb index build failing for $days day(s)"
          if [ "$days" -ge 3 ] && [ -z "$(gh issue list --label imdb-index --state open --json number --jq '.[].number')" ]; then
            gh label create imdb-index --color B60205 --description "IMDb dataset index build" 2>/dev/null || true
            gh issue create --label imdb-index \
              --title "IMDb index build failing for $days days" \
              --body "The daily scrape couldn't build the IMDb dataset index since $(date -u -d @"$first" +%F). Events are still scraped, but new screenings get no rating/duration. See ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi

      - name: Close IMDb failure issue
        if: steps.imdb-build.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for n in $(gh issue list --label imdb-index --state open --json number --jq '.[].number'); do
            gh issue close "$n" --comment "IMDb index built successfully in ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          done

      - name: Run scraper
        run: |
          uv run scraper/run.py

      # A venue missing from scraper/venues.py only reaches all_events; open
      # one issue per venue, the first time it's seen. The file exists only
      # when there are unknown venues. Dedupe on a hidden key in the issue
      # body (case/accent-insensitive, survives renames); closed issues
      # count, so a venue deliberately left out isn't reported again.
      - name: Report unknown venues
        if: hashFiles('.cache/unknown_venues.txt') != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create unknown-venue --color FBCA04 --description "Venue not in scraper/venues.py" 2>/dev/null || true
          reported=$(gh issue list --label unknown-venue --state all --limit 500 --json body --jq '.[].body')
          while IFS=$'\t' read -r key venue; do
            [ -n "$key" ] || continue
            if printf '%s\n' "$reported" | grep -Fq -- "<!-- venue-key: $key -->"; then
              echo "Already reported: $venue"
              continue
            fi
            gh issue create --label unknown-venue --title "Unknown venue: $venue" \
              --body "The agenda lists events at \"$venue\", which isn't in scraper/venues.py, so they only appear in all_events (CSV and calendar), with no venue calendar. Add it to VENUE_KEYWORDS (plus the page card and README links), or close this issue to ignore the venue: closed issues are not reopened. Seen in $RUN_URL
          <!-- venue-key: $key -->" \
              || echo "Warning: could not open an issue for $venue"
          done < .cache/unknown_venues.txt

      - name: Check for data changes
        id: git-check
        run: |
          # porcelain also catches new untracked files (e.g. a new venue's CSV/ICS)
          if [ -n "$(git status --porcelain -- data/ calendars/ docs/upcoming.json)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Update README timestamp
        if: steps.git-check.outputs.changed == 'true'
        run: |
          sed -i "s/\*\*Última actualización\*\*:.*/\*\*Última actualización\*\*: $(date -u +'%Y-%m-%d %H:%M UTC')/" README.md

      - name: Update GitHub Pages timestamp
        if: steps.git-check.outputs.changed == 'true'
        run: |
          TIMESTAMP=$(TZ='America/Argentina/Buenos_Aires' date +'%Y-%m-%d %H:%M')
          DATETIME=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          sed -i "s|<time datetime=\"[^\"]*\">[^<]*</time>|<time datetime=\"$DATETIME\">$TIMESTAMP</time>|" docs/index.html

      - name: Commit and push if changed
        if: steps.git-check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ calendars/ README.md docs/index.html docs/upcoming.json
          git commit -m "Update agenda data and calendars - $(TZ='America/Argentina/Buenos_Aires' date +'%Y-%m-%d %H:%M')"
          # main may have moved during the run (e.g. a push by the owner)
          for attempt in 1 2 3; do
            if git pull --rebase; then
              git push && exit 0
            else
              # Leave no half-done rebase behind, or every retry fails at once
              git rebase --abort 2>/dev/null || true
            fi
            echo "Push attempt $attempt failed, retrying"
            sleep 10
          done
          exit 1

      - name: No changes
        if: steps.git-check.outputs.changed != 'true'
        run: |
          echo "No changes detected in agenda data"

      # Any failed step (e.g. scrape, unreadable CSV, push) opens one issue;
      # the next successful run closes it
      - name: Open issue on pipeline failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ -z "$(gh issue list --label scrape-failure --state open --json number --jq '.[].number')" ]; then
            gh label create scrape-failure --color B60205 --description "Daily scrape pipeline failed" 2>/dev/null || true
            gh issue create --label scrape-failure \
              --title "Scrape pipeline failed" \
              --body "The scrape workflow failed (trigger: $EVENT), so calendars may not be updated. See $RUN_URL"
          else
            echo "scrape-failure issue already open"
          fi

      - name: Close pipeline failure issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          for n in $(gh issue list --label scrape-failure --state open --json number --jq '.[].number'); do
            gh issue close "$n" --comment "Scrape succeeded again in $RUN_URL"
          done
